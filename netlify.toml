[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_PUBLIC_PHP_BACKEND_URL = "https://api.gripforum.com"
  NEXT_PUBLIC_API_URL = "https://api.gripforum.com/api/admin"
  NEXT_PUBLIC_IMAGE_URL = "https://api.gripforum.com/api/public"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml"

# SEO: one canonical host. www.gripforum.com permanently redirects to gripforum.com
[[redirects]]
  from = "https://www.gripforum.com/*"
  to = "https://gripforum.com/:splat"
  status = 301
  force = true
